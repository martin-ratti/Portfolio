<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="960" cy="135" r="300" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="240" cy="540" r="240" fill="#8b5cf6" opacity="0.10" filter="url(#glow)" />

  <!-- Window Header / Browser Chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="16" fill="#0b0f19" fill-opacity="0.9" />
  <rect x="0" y="24" width="1200" height="20" fill="#0b0f19" fill-opacity="0.9" />
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#334155" stroke-width="1" />

  <!-- Mac / Window Dots -->
  <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="40" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="56" cy="22" r="5" fill="#10b981" opacity="0.8" />

  <!-- Address bar / Title Pill -->
  <rect x="80" y="10" width="960" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="600" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    PCFIX - E-Commerce Monorepo & Hardware Store
  </text>

  <!-- Status Badge in Chrome -->
  <rect x="1060" y="12" width="120" height="20" rx="10" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="1072" cy="22" r="3.5" fill="#3b82f6" />
  <text x="1084" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
    Production
  </text>

  <!-- Main Body Content Canvas -->
  <g transform="translate(24, 60)">
    
  <rect x="0" y="0" width="1152" height="570" rx="12" fill="url(#glassCard)" stroke="#334155" stroke-width="1" />
  
  <!-- Store Navigation Header -->
  <rect x="24" y="20" width="1104" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="48" y="55" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="bold">PCFIX<tspan fill="#60a5fa">.STORE</tspan></text>
  <rect x="220" y="32" width="450" height="36" rx="6" fill="#1e293b" stroke="#475569" />
  <text x="240" y="55" fill="#64748b" font-family="sans-serif" font-size="13">Buscar placas de video, procesadores, RAM...</text>

  <!-- Monorepo Badges -->
  <rect x="700" y="35" width="110" height="28" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" />
  <text x="755" y="53" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="bold">Astro Islands</text>

  <rect x="825" y="35" width="90" height="28" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
  <text x="870" y="53" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="bold">Node.js API</text>

  <rect x="930" y="35" width="90" height="28" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" />
  <text x="975" y="53" text-anchor="middle" fill="#c4b5fd" font-family="sans-serif" font-size="11" font-weight="bold">Docker</text>

  <!-- Catalog View -->
  <g transform="translate(24, 100)">
    <!-- Sidebar Filters -->
    <rect x="0" y="0" width="240" height="440" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="20" y="35" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Categorías</text>
    <text x="20" y="70" fill="#60a5fa" font-family="sans-serif" font-size="13">✓ Tarjetas Gráficas (24)</text>
    <text x="20" y="100" fill="#94a3b8" font-family="sans-serif" font-size="13">Procesadores AMD / Intel (18)</text>
    <text x="20" y="130" fill="#94a3b8" font-family="sans-serif" font-size="13">Motherboards B650 / Z790</text>
    <text x="20" y="160" fill="#94a3b8" font-family="sans-serif" font-size="13">Memorias DDR5 RGB (32)</text>
    <text x="20" y="190" fill="#94a3b8" font-family="sans-serif" font-size="13">Fuentes 80 Plus Gold (15)</text>

    <!-- Product Cards Grid -->
    <g transform="translate(260, 0)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="260" height="210" rx="8" fill="#1e293b" stroke="#334155" />
      <rect x="15" y="15" width="230" height="90" rx="6" fill="#0f172a" />
      <text x="130" y="65" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">RTX 4070 SUPER 12GB</text>
      <text x="15" y="135" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">NVIDIA GeForce RTX 4070</text>
      <text x="15" y="160" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold">$ 849.000</text>
      <rect x="15" y="172" width="230" height="26" rx="4" fill="#3b82f6" />
      <text x="130" y="189" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Comprar Ahora</text>

      <!-- Item 2 -->
      <rect x="280" y="0" width="260" height="210" rx="8" fill="#1e293b" stroke="#334155" />
      <rect x="295" y="15" width="230" height="90" rx="6" fill="#0f172a" />
      <text x="410" y="65" text-anchor="middle" fill="#ec4899" font-family="sans-serif" font-size="14" font-weight="bold">Ryzen 7 7800X3D</text>
      <text x="295" y="135" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">AMD 8 Cores / 16 Threads</text>
      <text x="295" y="160" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold">$ 590.000</text>
      <rect x="295" y="172" width="230" height="26" rx="4" fill="#3b82f6" />
      <text x="410" y="189" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Comprar Ahora</text>

      <!-- Item 3 -->
      <rect x="560" y="0" width="260" height="210" rx="8" fill="#1e293b" stroke="#334155" />
      <rect x="575" y="15" width="230" height="90" rx="6" fill="#0f172a" />
      <text x="690" y="65" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="bold">Corsair 32GB DDR5</text>
      <text x="575" y="135" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Vengeance 6000MHz CL30</text>
      <text x="575" y="160" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold">$ 185.000</text>
      <rect x="575" y="172" width="230" height="26" rx="4" fill="#3b82f6" />
      <text x="690" y="189" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Comprar Ahora</text>

      <!-- Architecture Banner Bottom -->
      <g transform="translate(0, 230)">
        <rect x="0" y="0" width="820" height="210" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="24" y="35" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold">Monorepo Pipeline & E2E Testing</text>
        <text x="24" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12">Turborepo • GitHub Actions CI/CD • Playwright E2E • Vitest • Prisma ORM</text>

        <!-- Pipeline Flow -->
        <rect x="24" y="85" width="170" height="90" rx="6" fill="#1e293b" stroke="#3b82f6" />
        <text x="40" y="115" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">Frontend (Astro)</text>
        <text x="40" y="140" fill="#64748b" font-family="sans-serif" font-size="11">SSR Islands + React</text>
        <text x="40" y="160" fill="#10b981" font-family="sans-serif" font-size="11">✓ Build OK</text>

        <text x="215" y="135" fill="#64748b" font-family="sans-serif" font-size="20">→</text>

        <rect x="250" y="85" width="170" height="90" rx="6" fill="#1e293b" stroke="#10b981" />
        <text x="266" y="115" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold">API (Express/Node)</text>
        <text x="266" y="140" fill="#64748b" font-family="sans-serif" font-size="11">JWT Auth + Prisma</text>
        <text x="266" y="160" fill="#10b981" font-family="sans-serif" font-size="11">✓ Tests Passed</text>

        <text x="440" y="135" fill="#64748b" font-family="sans-serif" font-size="20">→</text>

        <rect x="475" y="85" width="170" height="90" rx="6" fill="#1e293b" stroke="#8b5cf6" />
        <text x="491" y="115" fill="#c4b5fd" font-family="sans-serif" font-size="12" font-weight="bold">Database (Postgres)</text>
        <text x="491" y="140" fill="#64748b" font-family="sans-serif" font-size="11">Docker Container</text>
        <text x="491" y="160" fill="#10b981" font-family="sans-serif" font-size="11">✓ Connected</text>
      </g>
    </g>
  </g>

  </g>
</svg>