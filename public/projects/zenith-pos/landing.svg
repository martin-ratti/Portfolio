<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="960" cy="135" r="300" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="240" cy="540" r="240" fill="#8b5cf6" opacity="0.10" filter="url(#glow)" />

  <!-- Window Header / Browser Chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="16" fill="#0b0f19" fill-opacity="0.9" />
  <rect x="0" y="24" width="1200" height="20" fill="#0b0f19" fill-opacity="0.9" />
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#334155" stroke-width="1" />

  <!-- Mac / Window Dots -->
  <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="40" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="56" cy="22" r="5" fill="#10b981" opacity="0.8" />

  <!-- Address bar / Title Pill -->
  <rect x="80" y="10" width="960" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="600" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    Landing Page - Zenith POS (Astro 5 + Tailwind v4)
  </text>

  <!-- Status Badge in Chrome -->
  <rect x="1060" y="12" width="120" height="20" rx="10" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="1072" cy="22" r="3.5" fill="#06b6d4" />
  <text x="1084" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
    99% PageSpeed
  </text>

  <!-- Main Body Content Canvas -->
  <g transform="translate(24, 60)">
    
  <rect x="0" y="0" width="1152" height="570" rx="12" fill="url(#glassCard)" stroke="#334155" stroke-width="1" />
  
  <!-- Hero Section Mockup -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-opacity="0.4" />
    <text x="90" y="18" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">POTENCIA TU COMERCIO</text>
    
    <text x="0" y="80" fill="#ffffff" font-family="sans-serif" font-size="38" font-weight="bold">El Punto de Venta definitivo.</text>
    <text x="0" y="125" fill="#38bdf8" font-family="sans-serif" font-size="34" font-weight="bold">Rápido, Offline y Modular.</text>
    <text x="0" y="170" fill="#94a3b8" font-family="sans-serif" font-size="16">Diseñado para operar sin interrupciones, con impresión ESC/POS y arquitectura limpia.</text>

    <!-- CTA buttons -->
    <rect x="0" y="210" width="180" height="46" rx="8" fill="#06b6d4" />
    <text x="90" y="238" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">Descargar Demo</text>

    <rect x="200" y="210" width="180" height="46" rx="8" fill="transparent" stroke="#475569" stroke-width="1.5" />
    <text x="290" y="238" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Ver Características</text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="310" height="140" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="20" y="38" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">⚡ 100% Offline</text>
      <text x="20" y="68" fill="#94a3b8" font-family="sans-serif" font-size="13">Base de datos local SQLite con persistencia atómica y sin depender de internet.</text>

      <rect x="340" y="0" width="310" height="140" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="360" y="38" fill="#8b5cf6" font-family="sans-serif" font-size="16" font-weight="bold">🔒 Hardware ID</text>
      <text x="360" y="68" fill="#94a3b8" font-family="sans-serif" font-size="13">Activación por máquina segura contra copias no autorizadas.</text>

      <rect x="680" y="0" width="350" height="140" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="700" y="38" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold">🎨 White-label Branding</text>
      <text x="700" y="68" fill="#94a3b8" font-family="sans-serif" font-size="13">Personalizable con la identidad visual, logo y colores del cliente.</text>
    </g>
  </g>

  </g>
</svg>