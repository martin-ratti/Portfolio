      <text x="30" y="45" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Ticket Generado (PDF)</text>
      
      <rect x="25" y="70" width="310" height="400" rx="10" fill="#ffffff" />
      <rect x="25" y="70" width="310" height="60" rx="10" fill="#f43f5e" />
      <text x="180" y="108" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">TICKET OFICIAL #9482</text>
      
      <text x="50" y="160" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">Summer Electric Fest</text>
      <text x="50" y="185" fill="#64748b" font-family="sans-serif" font-size="12">Acceso: CAMPO VIP</text>
      <text x="50" y="210" fill="#64748b" font-family="sans-serif" font-size="12">Titular: Martín Ratti</text>

      <!-- Barcode simulation -->
      <g transform="translate(50, 240)">
        <line x1="0" y1="0" x2="0" y2="80" stroke="#000000" stroke-width="4" />
        <line x1="10" y1="0" x2="10" y2="80" stroke="#000000" stroke-width="2" />
        <line x1="20" y1="0" x2="20" y2="80" stroke="#000000" stroke-width="6" />
        <line x1="35" y1="0" x2="35" y2="80" stroke="#000000" stroke-width="1" />
        <line x1="45" y1="0" x2="45" y2="80" stroke="#000000" stroke-width="4" />
        <line x1="60" y1="0" x2="60" y2="80" stroke="#000000" stroke-width="8" />
        <line x1="78" y1="0" x2="78" y2="80" stroke="#000000" stroke-width="3" />
        <line x1="90" y1="0" x2="90" y2="80" stroke="#000000" stroke-width="5" />
        <line x1="110" y1="0" x2="110" y2="80" stroke="#000000" stroke-width="2" />
        <line x1="125" y1="0" x2="125" y2="80" stroke="#000000" stroke-width="6" />
        <line x1="145" y1="0" x2="145" y2="80" stroke="#000000" stroke-width="3" />
        <line x1="160" y1="0" x2="160" y2="80" stroke="#000000" stroke-width="7" />
        <line x1="180" y1="0" x2="180" y2="80" stroke="#000000" stroke-width="2" />
        <line x1="200" y1="0" x2="200" y2="80" stroke="#000000" stroke-width="5" />
      </g>
      <text x="180" y="350" text-anchor="middle" fill="#475569" font-family="monospace" font-size="12">SEC-HASH-8839-4491-STRIPE</text>
      <text x="180" y="420" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">✓ Pago Verificado vía Stripe</text>
    </g>
  </g>

  </g>
</svg>