<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="960" cy="135" r="300" fill="#f43f5e" opacity="0.12" filter="url(#glow)" />
  <circle cx="240" cy="540" r="240" fill="#8b5cf6" opacity="0.10" filter="url(#glow)" />

  <!-- Window Header / Browser Chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="16" fill="#0b0f19" fill-opacity="0.9" />
  <rect x="0" y="24" width="1200" height="20" fill="#0b0f19" fill-opacity="0.9" />
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#334155" stroke-width="1" />

  <!-- Mac / Window Dots -->
  <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="40" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="56" cy="22" r="5" fill="#10b981" opacity="0.8" />

  <!-- Address bar / Title Pill -->
  <rect x="80" y="10" width="960" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="600" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    TicketApp - Event Marketplace &amp; Ticket Issuing
  </text>

  <!-- Status Badge in Chrome -->
  <rect x="1060" y="12" width="120" height="20" rx="10" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="1072" cy="22" r="3.5" fill="#f43f5e" />
  <text x="1084" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
    Complete
  </text>

  <!-- Main Body Content Canvas -->
  <g transform="translate(24, 60)">
    
  <rect x="0" y="0" width="1152" height="570" rx="12" fill="url(#glassCard)" stroke="#334155" stroke-width="1" />
  
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="680" height="510" rx="12" fill="#0f172a" stroke="#334155" />
    <text x="30" y="45" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Cartelera de Festivales y Eventos</text>
    
    <!-- Event 1 -->
    <rect x="30" y="75" width="620" height="120" rx="8" fill="#1e293b" stroke="#475569" />
    <rect x="45" y="90" width="130" height="90" rx="6" fill="#be123c" />
    <text x="110" y="142" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">MUSIC FEST</text>
    <text x="195" y="115" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Summer Electric Festival 2026</text>
    <text x="195" y="140" fill="#94a3b8" font-family="sans-serif" font-size="12">Estadio Principal • 15 Nov 21:00 hs</text>
    <text x="195" y="165" fill="#f43f5e" font-family="sans-serif" font-size="15" font-weight="bold">$ 35.000 / entrada</text>
    <rect x="520" y="130" width="110" height="34" rx="6" fill="#f43f5e" />
    <text x="575" y="152" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Comprar</text>

    <!-- Event 2 -->
    <rect x="30" y="215" width="620" height="120" rx="8" fill="#1e293b" stroke="#475569" />
    <rect x="45" y="230" width="130" height="90" rx="6" fill="#6366f1" />
    <text x="110" y="282" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">TECH SUMMIT</text>
    <text x="195" y="255" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Conferencia Anual de Desarrolladores</text>
    <text x="195" y="280" fill="#94a3b8" font-family="sans-serif" font-size="12">Centro de Convenciones • 28 Nov 09:00 hs</text>
    <text x="195" y="305" fill="#f43f5e" font-family="sans-serif" font-size="15" font-weight="bold">$ 18.500 / entrada</text>
    <rect x="520" y="270" width="110" height="34" rx="6" fill="#f43f5e" />
    <text x="575" y="292" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Comprar</text>

