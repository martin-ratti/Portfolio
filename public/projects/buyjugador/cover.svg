<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="960" cy="135" r="300" fill="#eab308" opacity="0.12" filter="url(#glow)" />
  <circle cx="240" cy="540" r="240" fill="#8b5cf6" opacity="0.10" filter="url(#glow)" />

  <!-- Window Header / Browser Chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="16" fill="#0b0f19" fill-opacity="0.9" />
  <rect x="0" y="24" width="1200" height="20" fill="#0b0f19" fill-opacity="0.9" />
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#334155" stroke-width="1" />

  <!-- Mac / Window Dots -->
  <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="40" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="56" cy="22" r="5" fill="#10b981" opacity="0.8" />

  <!-- Address bar / Title Pill -->
  <rect x="80" y="10" width="960" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="600" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    BuyJugador - Multi-Client Inventory &amp; Sales (.NET 8)
  </text>

  <!-- Status Badge in Chrome -->
  <rect x="1060" y="12" width="120" height="20" rx="10" fill="#eab308" fill-opacity="0.2" stroke="#eab308" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="1072" cy="22" r="3.5" fill="#eab308" />
  <text x="1084" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
    Active
  </text>

  <!-- Main Body Content Canvas -->
  <g transform="translate(24, 60)">
    
  <rect x="0" y="0" width="1152" height="570" rx="12" fill="url(#glassCard)" stroke="#334155" stroke-width="1" />
  
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="530" height="510" rx="12" fill="#0f172a" stroke="#334155" />
    <text x="30" y="45" fill="#facc15" font-family="sans-serif" font-size="18" font-weight="bold">Cliente Web (Blazor WebAssembly)</text>
    <text x="30" y="70" fill="#94a3b8" font-family="sans-serif" font-size="12">Panel Administrativo y Reportes en Línea</text>

    <!-- Bar Chart Simulation -->
    <g transform="translate(30, 110)">
      <rect x="0" y="0" width="470" height="220" rx="8" fill="#1e293b" />
      <text x="20" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="13">Tendencia de Stock y Ventas (ScottPlot)</text>
      <rect x="40" y="160" width="40" height="70" rx="4" fill="#eab308" />
      <rect x="100" y="110" width="40" height="120" rx="4" fill="#eab308" />
      <rect x="160" y="80" width="40" height="150" rx="4" fill="#eab308" />
      <rect x="220" y="50" width="40" height="180" rx="4" fill="#38bdf8" />
      <rect x="280" y="90" width="40" height="140" rx="4" fill="#eab308" />
      <rect x="340" y="40" width="40" height="190" rx="4" fill="#38bdf8" />
      <rect x="400" y="30" width="40" height="200" rx="4" fill="#22c55e" />
    </g>

    <!-- Client Desktop Side -->
    <g transform="translate(560, 0)">
      <rect x="0" y="0" width="550" height="510" rx="12" fill="#0f172a" stroke="#334155" />
      <text x="30" y="45" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">Cliente Desktop (WinForms + C#)</text>
      <text x="30" y="70" fill="#94a3b8" font-family="sans-serif" font-size="12">Consumo de WebAPI centralizada con JWT</text>

      <rect x="30" y="110" width="490" height="360" rx="8" fill="#1e293b" stroke="#475569" />
      <text x="50" y="145" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Gestión de Artículos de Gaming</text>
      <line x1="50" y1="165" x2="490" y2="165" stroke="#334155" />

      <text x="50" y="195" fill="#94a3b8" font-family="monospace" font-size="12">ID   DESCRIPCIÓN             STOCK   PRECIO</text>
      <text x="50" y="225" fill="#e2e8f0" font-family="monospace" font-size="12">101  Joystick Wireless PS5    24    $ 98.000</text>
      <text x="50" y="255" fill="#e2e8f0" font-family="monospace" font-size="12">102  Auriculares 7.1 RGB      15    $ 62.500</text>
      <text x="50" y="285" fill="#e2e8f0" font-family="monospace" font-size="12">103  Teclado Mecánico Switch  08    $ 79.900</text>
      <text x="50" y="315" fill="#e2e8f0" font-family="monospace" font-size="12">104  Mouse Gamer 16000 DPI    42    $ 45.000</text>
    </g>
  </g>

  </g>
</svg>