<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="960" cy="135" r="300" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="240" cy="540" r="240" fill="#8b5cf6" opacity="0.10" filter="url(#glow)" />

  <!-- Window Header / Browser Chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="16" fill="#0b0f19" fill-opacity="0.9" />
  <rect x="0" y="24" width="1200" height="20" fill="#0b0f19" fill-opacity="0.9" />
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#334155" stroke-width="1" />

  <!-- Mac / Window Dots -->
  <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="40" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="56" cy="22" r="5" fill="#10b981" opacity="0.8" />

  <!-- Address bar / Title Pill -->
  <rect x="80" y="10" width="960" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="600" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    Extractor OCR - Vision Computer & Highlight Detection
  </text>

  <!-- Status Badge in Chrome -->
  <rect x="1060" y="12" width="120" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="1072" cy="22" r="3.5" fill="#10b981" />
  <text x="1084" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
    Utility
  </text>

  <!-- Main Body Content Canvas -->
  <g transform="translate(24, 60)">
    
  <rect x="0" y="0" width="1152" height="570" rx="12" fill="url(#glassCard)" stroke="#334155" stroke-width="1" />
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="540" height="510" rx="12" fill="#0f172a" stroke="#334155" />
    <text x="30" y="45" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Documento Original con Resaltados</text>
    
    <rect x="30" y="80" width="480" height="400" rx="8" fill="#ffffff" />
    <text x="50" y="120" fill="#334155" font-family="serif" font-size="15">Artículo 14. Derechos y Garantías Constitucionales.</text>
    
    <!-- Yellow highlight -->
    <rect x="50" y="140" width="380" height="26" fill="#fef08a" />
    <text x="55" y="158" fill="#0f172a" font-family="serif" font-size="15" font-weight="bold">Todos los habitantes gozan del derecho de trabajar</text>
    
    <!-- Green highlight -->
    <rect x="50" y="180" width="340" height="26" fill="#bbf7d0" />
    <text x="55" y="198" fill="#0f172a" font-family="serif" font-size="15" font-weight="bold">y ejercer toda industria lícita sin restricción</text>

    <!-- Pink highlight -->
    <rect x="50" y="220" width="310" height="26" fill="#fbcfe8" />
    <text x="55" y="238" fill="#0f172a" font-family="serif" font-size="15" font-weight="bold">de navegar y comerciar libremente.</text>

    <!-- Right Side OCR Output -->
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="540" height="510" rx="12" fill="#0f172a" stroke="#334155" />
      <text x="30" y="45" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">Texto Filtrado por Color (OpenCV + Tesseract)</text>

      <rect x="30" y="80" width="480" height="400" rx="8" fill="#090d16" stroke="#10b981" stroke-width="1" />
      <text x="50" y="120" fill="#a7f3d0" font-family="monospace" font-size="13">[DETECTED_COLOR: YELLOW (H:25-35)]</text>
      <text x="50" y="145" fill="#ffffff" font-family="monospace" font-size="13">"Todos los habitantes gozan del derecho de trabajar"</text>

      <text x="50" y="190" fill="#a7f3d0" font-family="monospace" font-size="13">[DETECTED_COLOR: GREEN (H:40-80)]</text>
      <text x="50" y="215" fill="#ffffff" font-family="monospace" font-size="13">"y ejercer toda industria lícita sin restricción"</text>

      <text x="50" y="260" fill="#a7f3d0" font-family="monospace" font-size="13">[DETECTED_COLOR: PINK (H:140-170)]</text>
      <text x="50" y="285" fill="#ffffff" font-family="monospace" font-size="13">"de navegar y comerciar libremente."</text>

      <rect x="50" y="380" width="200" height="40" rx="6" fill="#10b981" />
      <text x="150" y="405" text-anchor="middle" fill="#022c22" font-family="sans-serif" font-size="13" font-weight="bold">Exportar a TXT / JSON</text>
    </g>
  </g>

  </g>
</svg>