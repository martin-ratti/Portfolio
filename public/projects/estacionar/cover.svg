<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="960" cy="135" r="300" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="240" cy="540" r="240" fill="#8b5cf6" opacity="0.10" filter="url(#glow)" />

  <!-- Window Header / Browser Chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="16" fill="#0b0f19" fill-opacity="0.9" />
  <rect x="0" y="24" width="1200" height="20" fill="#0b0f19" fill-opacity="0.9" />
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#334155" stroke-width="1" />

  <!-- Mac / Window Dots -->
  <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="40" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="56" cy="22" r="5" fill="#10b981" opacity="0.8" />

  <!-- Address bar / Title Pill -->
  <rect x="80" y="10" width="960" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="600" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    EstacionAR - Mobile Smart Parking App
  </text>

  <!-- Status Badge in Chrome -->
  <rect x="1060" y="12" width="120" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="1072" cy="22" r="3.5" fill="#10b981" />
  <text x="1084" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
    Work in Progress
  </text>

  <!-- Main Body Content Canvas -->
  <g transform="translate(24, 60)">
    
  <rect x="0" y="0" width="1152" height="570" rx="12" fill="url(#glassCard)" stroke="#334155" stroke-width="1" />
  
  <!-- Mobile Device Frames -->
  <g transform="translate(100, 30)">
    <!-- Phone 1 (Map view) -->
    <rect x="0" y="0" width="280" height="510" rx="36" fill="#020617" stroke="#334155" stroke-width="3" />
    <rect x="90" y="12" width="100" height="18" rx="9" fill="#0f172a" />
    <rect x="15" y="45" width="250" height="445" rx="20" fill="#0f172a" />
    
    <!-- Map Sim -->
    <rect x="25" y="55" width="230" height="300" rx="12" fill="#1e293b" />
    <circle cx="140" cy="180" r="16" fill="#10b981" fill-opacity="0.3" />
    <circle cx="140" cy="180" r="7" fill="#10b981" />
    <text x="140" y="210" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="bold">Estacionamiento Central</text>

    <!-- Bottom sheet reservation card -->
    <rect x="25" y="370" width="230" height="105" rx="10" fill="#0f172a" stroke="#334155" />
    <text x="38" y="395" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Cochera Cubierta #14</text>
    <text x="38" y="415" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold">$ 1.800 / hora</text>
    <rect x="38" y="430" width="204" height="32" rx="6" fill="#10b981" />
    <text x="140" y="451" text-anchor="middle" fill="#022c22" font-family="sans-serif" font-size="11" font-weight="bold">Reservar Ahora</text>

    <!-- Phone 2 (QR Ticket Pass) -->
    <g transform="translate(340, 0)">
      <rect x="0" y="0" width="280" height="510" rx="36" fill="#020617" stroke="#334155" stroke-width="3" />
      <rect x="90" y="12" width="100" height="18" rx="9" fill="#0f172a" />
      <rect x="15" y="45" width="250" height="445" rx="20" fill="#0f172a" />
      
      <text x="140" y="90" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold">Pase de Ingreso</text>
      
      <!-- QR code mockup -->
      <rect x="55" y="120" width="170" height="170" rx="8" fill="#ffffff" />
      <rect x="75" y="140" width="45" height="45" fill="#000000" />
      <rect x="160" y="140" width="45" height="45" fill="#000000" />
      <rect x="75" y="225" width="45" height="45" fill="#000000" />
      <rect x="145" y="210" width="25" height="25" fill="#000000" />
      <rect x="180" y="240" width="25" height="25" fill="#000000" />

      <text x="140" y="325" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Escanee en la barrera de acceso</text>
      <text x="140" y="360" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Vehículo: ABC 123 CD</text>
      <text x="140" y="385" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="12">Válido hasta: 20:30 hs</text>
    </g>

    <!-- Feature highlights right column -->
    <g transform="translate(680, 20)">
      <text x="0" y="40" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">Smart Parking</text>
      <text x="0" y="75" fill="#10b981" font-family="sans-serif" font-size="20" font-weight="600">Mobile-First Experience</text>
      <text x="0" y="115" fill="#94a3b8" font-family="sans-serif" font-size="14" width="300">Desarrollado con React Native + Expo para iOS y Android, con backend escalable en Node.js y PostgreSQL.</text>

      <g transform="translate(0, 160)">
        <circle cx="15" cy="20" r="10" fill="#10b981" fill-opacity="0.2" />
        <text x="35" y="25" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">Geolocalización en tiempo real</text>

        <circle cx="15" cy="70" r="10" fill="#10b981" fill-opacity="0.2" />
        <text x="35" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">Roles de Conductor, Dueño y Admin</text>

        <circle cx="15" cy="120" r="10" fill="#10b981" fill-opacity="0.2" />
        <text x="35" y="125" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">Integración de pagos automáticos</text>
      </g>
    </g>
  </g>

  </g>
</svg>